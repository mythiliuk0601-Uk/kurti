<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KurtiAura – Wear Your Elegance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Shows any hidden error on screen so a blank page is never silent.
      function kaShow(msg) {
        var d = document.getElementById("ka-err");
        if (!d) {
          d = document.createElement("pre");
          d.id = "ka-err";
          d.style.cssText = "position:fixed;z-index:99999;left:0;right:0;top:0;margin:0;padding:16px;background:#b00020;color:#fff;font:13px/1.4 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto";
          document.body.appendChild(d);
        }
        d.textContent += msg + "\n\n";
      }
      window.addEventListener("error", function (e) {
        kaShow("ERROR: " + e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        kaShow("PROMISE ERROR: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    </script>
  </head>
  <body>
    <div id="root"><p style="font-family:sans-serif;padding:24px;color:#6e0f3c">Loading KurtiAura…</p></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
